# Имя проекта задано явно: по умолчанию compose берёт его из имени папки,
# а она у нас кириллическая («авито») — compose такое имя не принимает.
name: sbavito

# Только сервис app. Postgres и Redis — СУЩЕСТВУЮЩИЕ контейнеры хоста
# (postgres16 :5432 и redis :6379), свои не поднимаем: их образы делят
# соседние проекты, менять их нельзя.
services:
  app:
    build: .
    image: sbavito-app:latest
    container_name: sbavito-app
    env_file: .env
    environment:
      # В .env адреса локальные (127.0.0.1) — из контейнера это он сам,
      # поэтому переопределяем на шлюз хоста.
      PGHOST: host.docker.internal
      REDIS_URL: redis://host.docker.internal:6379/3
    extra_hosts:
      # На Docker Desktop имя есть само, на Linux-сервере его даёт эта строка.
      - "host.docker.internal:host-gateway"
    volumes:
      # Код монтируем — правка .py подхватывается автоперезагрузкой без пересборки.
      - ./bot:/app/bot
      - ./tests:/app/tests
      - ./migrations:/app/migrations
      - ./data:/app/data
      # Прайс клиента читаем из оригинала, а не из копии: копия молча устареет,
      # и бот начнёт называть вчерашние цены. Только чтение — ETL сюда не пишет.
      # Папка в .gitignore (клиентские материалы), на монтирование это не влияет.
      - ./материалы:/app/материалы:ro
    # Автоперезагрузка в dev: watchmedo следит за bot/ и перезапускает процесс.
    # --debug-force-polling обязателен: правка файла на хосте Windows/macOS не
    # порождает inotify-событие внутри контейнера, и без опроса рестарта не будет.
    command: >
      watchmedo auto-restart
      --directory /app/bot --pattern '*.py' --recursive
      --debug-force-polling --signal SIGTERM
      -- python -m bot.main
    restart: unless-stopped
