<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SBAvito — переписки ботов</title>
<style>
  :root{
    --bg:#f4f6f5; --panel:#fff; --line:#e3e9e6; --ink:#12211d; --muted:#6d817a;
    --brand:#127a63; --brand2:#25b18e; --client:#eef2f1; --bot:#e6f5ef;
  }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.45 -apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
  header{display:flex;align-items:center;gap:12px;padding:12px 18px;background:linear-gradient(90deg,var(--brand2),var(--brand));color:#fff}
  header .logo{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-weight:800}
  header h1{font-size:17px;margin:0;font-weight:700}
  header .sp{flex:1}
  header input{padding:7px 10px;border:0;border-radius:8px;width:320px;max-width:40vw;font:inherit}
  header button{padding:7px 14px;border:0;border-radius:8px;background:#0f3b34;color:#fff;font:inherit;cursor:pointer}
  header button:hover{background:#0c2e29}
  .wrap{display:grid;grid-template-columns:340px 1fr;gap:0;height:calc(100vh - 56px)}
  .chats{border-right:1px solid var(--line);overflow-y:auto;background:var(--panel)}
  .chat{padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
  .chat:hover{background:var(--client)}
  .chat.active{background:var(--bot)}
  .chat .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .chat .who{font-weight:600}
  .chat .acc{font-size:11px;color:#fff;background:var(--brand);padding:1px 7px;border-radius:20px}
  .chat .prev{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .chat .time{color:var(--muted);font-size:11px}
  .thread{overflow-y:auto;padding:18px 22px}
  .msg{max-width:70%;margin:8px 0;padding:9px 13px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
  .msg.client{background:var(--client);border-bottom-left-radius:4px}
  .msg.bot{background:var(--bot);margin-left:auto;border-bottom-right-radius:4px}
  .msg .role{font-size:11px;color:var(--muted);margin-bottom:3px}
  .msg .time{font-size:10px;color:var(--muted);margin-top:4px;text-align:right}
  .empty{color:var(--muted);padding:40px;text-align:center}
  .bar{display:flex;align-items:center;gap:10px;padding:10px 22px;border-bottom:1px solid var(--line);background:var(--panel)}
  .bar b{font-size:15px}
  .refresh{margin-left:auto;font-size:12px;color:var(--muted);cursor:pointer;user-select:none}
  .refresh:hover{color:var(--brand)}
</style>
</head>
<body>
<header>
  <div class="logo">SB</div>
  <h1>SBAvito — переписки ботов</h1>
  <div class="sp"></div>
  <input id="tok" type="password" placeholder="Токен доступа" autocomplete="off">
  <button id="go">Подключиться</button>
</header>

<div class="wrap">
  <div class="chats" id="chats"><div class="empty">Введите токен и нажмите «Подключиться»</div></div>
  <div style="display:flex;flex-direction:column;min-height:0">
    <div class="bar"><b id="thead">Диалог</b><span class="refresh" id="refresh" title="Обновить" style="display:none">↻ обновить</span></div>
    <div class="thread" id="thread"><div class="empty">Выберите чат слева</div></div>
  </div>
</div>

<script>
const API = ""; // тот же домен, что и страница → /api/... , CORS не нужен
let TOKEN = localStorage.getItem("sbavito_token") || "";
let curDialog = null;

const $ = s => document.querySelector(s);
const esc = t => { const d=document.createElement("div"); d.textContent = t==null?"":String(t); return d.innerHTML; };
const fmt = iso => { if(!iso) return ""; const d=new Date(iso); return isNaN(d)?"":d.toLocaleString("ru-RU",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}); };

async function api(path){
  const r = await fetch(API + path, { headers: { Authorization: "Bearer " + TOKEN } });
  if(r.status === 401) throw new Error("Неверный токен");
  if(!r.ok) throw new Error("Ошибка " + r.status);
  return r.json();
}

async function loadChats(){
  const box = $("#chats");
  box.innerHTML = '<div class="empty">Загружаю…</div>';
  try{
    const data = await api("/api/chats");
    const chats = data.chats || [];
    if(!chats.length){ box.innerHTML = '<div class="empty">Диалогов пока нет</div>'; return; }
    box.innerHTML = "";
    for(const c of chats){
      const who = c.client_name || c.client_username || c.chat_key;
      const el = document.createElement("div");
      el.className = "chat";
      el.dataset.id = c.dialog_id;
      el.innerHTML =
        '<div class="top"><span class="who">'+esc(who)+'</span><span class="acc">'+esc(c.account)+'</span></div>'+
        '<div class="prev">'+esc(c.preview||"")+'</div>'+
        '<div class="time">'+esc(fmt(c.last_message_at))+'</div>';
      el.onclick = () => { document.querySelectorAll(".chat").forEach(x=>x.classList.remove("active")); el.classList.add("active"); openDialog(c.dialog_id, who); };
      box.appendChild(el);
    }
  }catch(e){ box.innerHTML = '<div class="empty">'+esc(e.message)+'</div>'; }
}

async function openDialog(id, who){
  curDialog = id;
  $("#thead").textContent = who || ("Диалог #"+id);
  $("#refresh").style.display = "inline";
  const box = $("#thread");
  box.innerHTML = '<div class="empty">Загружаю…</div>';
  try{
    const data = await api("/api/dialog/"+encodeURIComponent(id));
    const msgs = data.messages || [];
    if(!msgs.length){ box.innerHTML = '<div class="empty">Сообщений нет</div>'; return; }
    box.innerHTML = "";
    for(const m of msgs){
      const el = document.createElement("div");
      el.className = "msg " + (m.role === "bot" ? "bot" : "client");
      el.innerHTML =
        '<div class="role">'+(m.role==="bot"?"Бот":"Клиент")+'</div>'+
        esc(m.body)+
        '<div class="time">'+esc(fmt(m.created_at))+'</div>';
      box.appendChild(el);
    }
    box.scrollTop = box.scrollHeight;
  }catch(e){ box.innerHTML = '<div class="empty">'+esc(e.message)+'</div>'; }
}

function connect(){
  TOKEN = $("#tok").value.trim();
  if(!TOKEN){ return; }
  localStorage.setItem("sbavito_token", TOKEN);
  loadChats();
}

$("#go").onclick = connect;
$("#tok").addEventListener("keydown", e => { if(e.key==="Enter") connect(); });
$("#refresh").onclick = () => { if(curDialog) openDialog(curDialog, $("#thead").textContent); loadChats(); };

// автоподхват сохранённого токена
if(TOKEN){ $("#tok").value = TOKEN; loadChats(); }
</script>
</body>
</html>
