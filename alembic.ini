# Alembic. URL к БД здесь НЕ хранится — его подставляет migrations/env.py
# из .env (иначе пароль уехал бы в публичный репо).
[alembic]
script_location = migrations
prepend_sys_path = .
# Имя ревизии: дата + slug, чтобы порядок читался глазами в списке файлов.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
timezone = Europe/Moscow

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %d.%m.%Y %H:%M:%S
