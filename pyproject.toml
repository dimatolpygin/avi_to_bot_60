[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sbavito"
version = "0.2.0"
description = "SB Group: ИИ-боты для аккаунтов Авито (обкатка в Telegram)"
requires-python = ">=3.12"

dependencies = [
    # Транспорт: три Telegram-бота для обкатки (этап 10), потом адаптер Авито (этап 14)
    "aiogram>=3.13,<4",
    # Данные: SQLAlchemy 2.0 async + миграции (этап 3)
    "SQLAlchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    # Память диалога, дебаунс, round-robin (этапы 9-12)
    "redis>=5.0",
    # HTTP-клиент: OpenRouter, amoCRM, Avito Messenger API
    "httpx>=0.27",
    # Конфиг из .env
    "python-dotenv>=1.0",
    # Поиск по прайсу (этапы 5-6)
    "snowballstemmer>=2.2",
    "rapidfuzz>=3.9",
    # ETL прайса (этап 4)
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# Только для разработки: автоперезагрузка (watchmedo) и тесты.
dev = [
    "watchdog>=4.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools]
packages = ["bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
